# Builds the Windows installer and publishes it as a GitHub Release.
# The app's auto-updater (electron-updater) reads these releases.
#
# To ship an update:
#   1. Bump "version" in package.json (e.g. 1.0.4) and commit.
#   2. git tag v1.0.4 && git push origin main --tags
# The tag must match the package.json version.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Test
        run: npm test

      # electron-builder uploads several files in parallel and can end up creating the release
      # twice. Create exactly one draft first (removing leftovers for this tag); it uploads into it.
      - name: Prepare a single draft release
        shell: bash
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id"); do
            echo "Removing existing release $id for $GITHUB_REF_NAME"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "PeruanisticSPEAK ${GITHUB_REF_NAME}. Descarga el instalador .exe de abajo. Si ya tienes la 1.0.3 o superior, la app se actualiza sola."

      - name: Build and upload installer
        run: npm run release

      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
